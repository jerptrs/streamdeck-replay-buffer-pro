name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fails early when CHANGELOG.md has no section for the tagged version.
      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        run: |
          mkdir -p dist
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > dist/release-notes.md

      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test

      - name: Pack plugin
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version="$(node -p 'require("./package.json").version')"
          npx streamdeck pack com.replay-buffer-pro.obs.sdPlugin --output dist --force --version "$version"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streamDeckPlugin
          path: |
            dist/*.streamDeckPlugin
            dist/release-notes.md
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: streamDeckPlugin
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.streamDeckPlugin --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file dist/release-notes.md
